name: VPN Gate Node Check

on:
  # Enable scheduled checks after the node entry service is available:
  # schedule:
  #   - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          CHECK_WORKER: ${{ secrets.DOMAIN }}
          CHECK_CONCURRENCY: "8"
          CHECK_TIMEOUT: "30"
          VPNGATE_API: "https://www.vpngate.net/api/iphone/"
          NODES_URL: "https://rui-jack.github.io/gate/nodes.txt"
          EDGE_HOSTS: "edge.20061124.xyz:443"
          OPTIMAL_API: ""

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "site: https://rui-jack.github.io/gate/ (deploy outcome: ${{ steps.deployment.outcome }})"'
