name: Deployment connectivity diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe Worker and custom domain from GitHub network
        run: |
          for endpoint in https://edgetunnel.ruijack484.workers.dev/login https://edge.20061124.xyz/login; do
            echo "Checking $endpoint"
            curl --silent --show-error --max-time 30 --output response.txt --write-out 'HTTP %{http_code}\n' "$endpoint"
            head -c 100 response.txt
            echo
          done
